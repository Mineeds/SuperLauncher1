name: Windows Release Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.4
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.4.2'

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy (collect Qt DLLs)
        run: windeployqt --release --no-translations --compiler-runtime build/Release/SuperLauncher.exe

      - name: Package
        run: Compress-Archive -Path build/Release/* -DestinationPath SuperLauncher-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SuperLauncher-win64
          path: SuperLauncher-win64.zip
